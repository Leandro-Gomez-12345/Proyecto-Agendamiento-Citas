spring.application.name=Proyecto_Agendamiento_Citas

logging.level.root=INFO
logging.level.co.com.proyectoagendamientocitas=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sin-id}] %logger{36} - %msg%n

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}